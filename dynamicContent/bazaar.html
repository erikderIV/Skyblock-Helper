<link rel="stylesheet" href="css/bazaar.css" />
<div class="searchbar-container">
    <div class="searchbar" id="searchbar">
        <svg width="20" height="20" class=" icon">
            <circle cx="7.5" cy="7.5" r="5"></circle>
            <line x1="11" x2="15" y1="11" y2="15"></line>
        </svg>
        <input class="search" id="search" placeholder="Search for items..." autocomplete="off" />
    </div>
</div>
<div class="table-container">
    <div class="table-wrapper">
        <table>
            <thead id="thead">
                <tr>
                    <th>
                        <button id="product">
                            <span>
                                Product
                            </span>
                        </button>
                    </th>
                    <th>
                        <button id="buyPrice">
                            <span>
                                Buy Price
                            </span>
                        </button>
                    </th>
                    <th>
                        <button id="sellPrice">
                            <span>
                                Sell Price
                            </span>
                        </button>
                    </th>
                    <th>
                        <button id="profit">
                            <span>
                                Profit
                            </span>
                        </button>
                    </th>
                    <th>
                        <button id="buyOrders">
                            <span>
                                Buy Orders
                            </span>
                        </button>
                    </th>
                    <th>
                        <button id="sellOrders">
                            <span>
                                Sell Orders
                            </span>
                        </button>
                    </th>
                    <th>
                        <button id="buyVolume">
                            <span>
                                Buy Volume
                            </span>
                        </button>
                    </th>
                    <th>
                        <button id="sellVolume">
                            <span>
                                Sell Volume
                            </span>
                        </button>
                    </th>
                    <th>
                        <button id="buyMovingWeek">
                            <span>
                                Buy Moving Week
                            </span>
                        </button>
                    </th>
                    <th>
                        <button id="sellMovingWeek">
                            <span>
                                Sell Moving Week
                            </span>
                        </button>
                    </th>
                </tr>
            </thead>
            <tbody id="tbody">
                <tr>
                    <td>
                        test
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="js/bazaar.js"></script>
